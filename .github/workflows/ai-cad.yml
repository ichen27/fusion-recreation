name: AI CAD contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  model-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Rust
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.85.1 fmt --manifest-path crates/model-engine/Cargo.toml --check
      - run: cargo +1.85.1 clippy --manifest-path crates/model-engine/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +1.85.1 test --manifest-path crates/model-engine/Cargo.toml --locked --release
      - run: cargo +1.85.1 build --manifest-path crates/model-engine/Cargo.toml --release --locked
      - run: python -m pip install -r tools/ai-cad/requirements.lock ruff==0.14.0
      - run: ruff check tools/ai-cad && ruff format --check tools/ai-cad
      - run: python -m unittest discover -s tools/ai-cad -p 'test_*.py' -v
      - run: python tools/ai-cad/verify_rebuild.py
      - run: python tools/ai-cad/verify_mcp.py
      - run: python tools/ai-cad/verify_boolean_mcp.py
      - run: python tools/ai-cad/verify_polyhedral_transform_mcp.py
      - run: python tools/ai-cad/verify_polyhedral_cut_mcp.py
      - run: python tools/ai-cad/verify_concave_operations_mcp.py
      - run: python tools/ai-cad/verify_instances_mcp.py
      - run: python tools/ai-cad/verify_analytic_placement_mcp.py
      - run: python tools/ai-cad/verify_measurements_mcp.py
      - run: python tools/ai-cad/verify_analytic_measurements_mcp.py
      - run: python tools/ai-cad/verify_counterbores_mcp.py
      - run: python tools/ai-cad/verify_topology_mcp.py
      - run: python tools/ai-cad/verify_surface_context_mcp.py
      - run: python tools/ai-cad/verify_selection_guard_mcp.py
      - run: python tools/ai-cad/verify_codex_recording.py
      - run: python tools/ai-cad/verify_profile_example.py
      - run: python tools/ai-cad/verify_relationship_example.py
      - run: python tools/ai-cad/verify_bracket_example.py
      - run: python tools/ai-cad/verify_concave_example.py
      - run: python tools/ai-cad/verify_round_example.py
      - run: python tools/ai-cad/verify_blind_example.py
      - run: python tools/ai-cad/verify_plane_example.py
      - run: python tools/ai-cad/verify_stock_recording.py
      - run: python tools/ai-cad/verify_native_recording.py
      - run: python tools/ai-cad/verify_sketch_plane.py
      - run: python tools/ai-cad/verify_booleans.py
      - run: python tools/ai-cad/verify_polyhedral_transforms.py
      - run: python tools/ai-cad/verify_polyhedral_cuts.py
      - run: python tools/ai-cad/verify_concave_operations.py
      - run: python tools/ai-cad/verify_instances.py
      - run: python tools/ai-cad/verify_analytic_placement.py
      - run: python tools/ai-cad/verify_measurements.py
      - run: python tools/ai-cad/verify_analytic_measurements.py
      - run: python tools/ai-cad/verify_counterbores.py
      - run: python tools/ai-cad/verify_topology_recording.py
      - run: python tools/ai-cad/verify_surface_context_recording.py
      - run: python tools/ai-cad/verify_selection_guard_recording.py
      - run: python tools/ai-cad/verify_intersection.py
      - run: python tools/ai-cad/verify_preview_recording.py
      - run: python tools/ai-cad/verify_intent_recording.py
      - run: python tools/ai-cad/verify_selection_recording.py
      - run: python tools/ai-cad/verify_rotation.py
      - run: python tools/ai-cad/verify_translation.py
      - run: python -m pip install -r tools/ai-cad/step-requirements.txt
      - run: python tools/ai-cad/verify_step_export.py
      - run: python tools/ai-cad/verify_concave_export.py
      - run: python tools/ai-cad/verify_round_export.py
      - run: python tools/ai-cad/verify_blind_export.py
      - run: python tools/ai-cad/verify_plane_export.py
      - run: python tools/ai-cad/verify_sketch_plane_export.py
      - run: python tools/ai-cad/verify_boolean_export.py
      - run: python tools/ai-cad/verify_polyhedral_transform_export.py
      - run: python tools/ai-cad/verify_polyhedral_cut_export.py
      - run: python tools/ai-cad/verify_concave_operations_export.py
      - run: python tools/ai-cad/verify_instances_export.py
      - run: python tools/ai-cad/verify_analytic_placement_export.py
      - run: python tools/ai-cad/verify_measurements_reference.py
      - run: python tools/ai-cad/verify_analytic_measurements_reference.py
      - run: python tools/ai-cad/verify_counterbores_export.py
      - run: python tools/ai-cad/verify_topology_export.py
      - run: python tools/ai-cad/verify_intersection_export.py
      - run: python tools/ai-cad/verify_rotation_export.py
      - run: python tools/ai-cad/verify_translation_export.py
      - run: python tools/ai-cad/verify_sketch_recording.py
      - run: python tools/ai-cad/verify_hole_recording.py
      - run: python tools/ai-cad/verify_feature_edits.py
      - run: python tools/ai-cad/verify_sketch_relationships.py
      - run: node --test tools/ai-cad/test_boolean_editor.mjs tools/ai-cad/test_preview_client.mjs tools/ai-cad/test_rotation_editor.mjs tools/ai-cad/test_translation_editor.mjs tools/ai-cad/test_picking.mjs tools/ai-cad/test_intersection_editor.mjs tools/ai-cad/test_stock_editor.mjs tools/ai-cad/test_plane_editor.mjs tools/ai-cad/test_sketch.mjs tools/ai-cad/test_hole_editor.mjs tools/ai-cad/test_display.mjs
      - run: node --check tools/ai-cad/web/app.js
      - run: node --check tools/ai-cad/benchmark_browser.js
      - run: npx --yes prettier@3.6.2 --check tools/ai-cad/test_boolean_editor.mjs tools/ai-cad/web/boolean-model.mjs tools/ai-cad/web/boolean-editor.mjs tools/ai-cad/test_preview_client.mjs tools/ai-cad/web/preview-client.mjs tools/ai-cad/test_rotation_editor.mjs tools/ai-cad/web/rotation-model.mjs tools/ai-cad/web/rotation-editor.mjs tools/ai-cad/web/vector-parameters.mjs tools/ai-cad/test_translation_editor.mjs tools/ai-cad/web/translate-model.mjs tools/ai-cad/web/translate-editor.mjs tools/ai-cad/test_picking.mjs tools/ai-cad/web/picking.mjs tools/ai-cad/test_intersection_editor.mjs tools/ai-cad/web/intersection-model.mjs tools/ai-cad/web/intersection-editor.mjs tools/ai-cad/test_stock_editor.mjs tools/ai-cad/web/stock-model.mjs tools/ai-cad/web/stock-editor.mjs tools/ai-cad/test_plane_editor.mjs tools/ai-cad/web/plane-model.mjs tools/ai-cad/web/plane-editor.mjs tools/ai-cad/test_display.mjs tools/ai-cad/web/display-data.mjs tools/ai-cad/web/topology-view.mjs tools/ai-cad/web/app.js tools/ai-cad/web/index.html tools/ai-cad/web/style.css tools/ai-cad/web/sketch-model.mjs tools/ai-cad/web/sketch-editor.mjs tools/ai-cad/test_sketch.mjs tools/ai-cad/web/hole-model.mjs tools/ai-cad/web/hole-editor.mjs tools/ai-cad/test_hole_editor.mjs
