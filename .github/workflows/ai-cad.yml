name: AI CAD contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  model-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Rust
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.85.1 fmt --manifest-path crates/model-engine/Cargo.toml --check
      - run: cargo +1.85.1 clippy --manifest-path crates/model-engine/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +1.85.1 build --manifest-path crates/model-engine/Cargo.toml --release --locked
      - run: python -m pip install -r tools/ai-cad/requirements.lock ruff==0.14.0
      - run: ruff check tools/ai-cad && ruff format --check tools/ai-cad
      - run: python -m unittest discover -s tools/ai-cad -p 'test_*.py' -v
      - run: python tools/ai-cad/verify_mcp.py
      - run: python tools/ai-cad/verify_codex_recording.py
      - run: python tools/ai-cad/verify_profile_example.py
      - run: node --check tools/ai-cad/web/app.js
      - run: npx --yes prettier@3.6.2 --check tools/ai-cad/web/app.js tools/ai-cad/web/index.html tools/ai-cad/web/style.css
