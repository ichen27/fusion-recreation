name: AI CAD contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  model-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Rust
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.85.1 fmt --manifest-path crates/model-engine/Cargo.toml --check
      - run: cargo +1.85.1 clippy --manifest-path crates/model-engine/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +1.85.1 test --manifest-path crates/model-engine/Cargo.toml --locked --release
      - run: cargo +1.85.1 build --manifest-path crates/model-engine/Cargo.toml --release --locked
      - run: python -m pip install -r tools/ai-cad/requirements.lock ruff==0.14.0
      - run: ruff check tools/ai-cad && ruff format --check tools/ai-cad
      - run: python -m unittest discover -s tools/ai-cad -p 'test_*.py' -v
      - run: python tools/ai-cad/verify_rebuild.py
      - run: python tools/ai-cad/verify_native_worker.py
      - run: python tools/ai-cad/verify_edge_measurements.py
      - run: python tools/ai-cad/verify_edge_highlight.py
      - run: python tools/ai-cad/verify_interference.py
      - run: python tools/ai-cad/verify_clearance.py
      - run: python tools/ai-cad/verify_clearance_mcp.py
      - run: python tools/ai-cad/verify_interference_mcp.py
      - run: python tools/ai-cad/verify_edge_measurements_mcp.py
      - run: python tools/ai-cad/benchmark_native_worker.py --samples 3
      - run: python tools/ai-cad/benchmark_curved_runtime.py --samples 1
      - run: python tools/ai-cad/verify_mcp.py
      - run: python tools/ai-cad/verify_boolean_mcp.py
      - run: python tools/ai-cad/verify_polyhedral_transform_mcp.py
      - run: python tools/ai-cad/verify_polyhedral_cut_mcp.py
      - run: python tools/ai-cad/verify_concave_operations_mcp.py
      - run: python tools/ai-cad/verify_instances_mcp.py
      - run: python tools/ai-cad/verify_analytic_placement_mcp.py
      - run: python tools/ai-cad/verify_measurements_mcp.py
      - run: python tools/ai-cad/verify_analytic_measurements_mcp.py
      - run: python tools/ai-cad/verify_counterbores_mcp.py
      - run: python tools/ai-cad/verify_frustum_mcp.py
      - run: python tools/ai-cad/verify_countersinks_mcp.py
      - run: python tools/ai-cad/verify_individual_depths_mcp.py
      - run: python tools/ai-cad/verify_mirror_mcp.py
      - run: python tools/ai-cad/verify_revolution_mcp.py
      - run: python tools/ai-cad/verify_coaxial_boolean.py
      - run: python tools/ai-cad/verify_coaxial_boolean_mcp.py
      - run: python tools/ai-cad/verify_coaxial.py
      - run: python tools/ai-cad/verify_coaxial.py --concave
      - run: python tools/ai-cad/verify_coaxial_mcp.py
      - run: python tools/ai-cad/verify_coaxial_mcp.py --concave
      - run: python tools/ai-cad/verify_linear_constraints_mcp.py
      - run: python tools/ai-cad/verify_linear_constraints.py
      - run: python tools/ai-cad/verify_linear_editor.py
